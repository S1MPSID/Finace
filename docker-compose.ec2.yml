# EC2 — both services on one machine.
# Env files on host: ~/.env (node)  ~/.env2 (python-rag)
#
#   docker compose -f docker-compose.ec2.yml pull
#   docker compose -f docker-compose.ec2.yml up -d

services:
  python-rag:
    image: ${RAG_IMAGE:-sambhav30/finace-rag:latest}
    container_name: finace-python-rag
    restart: unless-stopped
    env_file:
      - ${HOME}/.env2
    environment:
      PORT: "8000"
      DATA_DIR: /app/data
      EMBEDDING_BACKEND: fastembed
      RAG_LIGHT_XAI: "1"
      RETRIEVAL_MAX_CANDIDATES: "150"
      WARM_EMBEDDER: "1"
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - finace

  node-api:
    image: ${NODE_IMAGE:-sambhav30/finace-node:latest}
    container_name: finace-node-api
    restart: unless-stopped
    env_file:
      - ${HOME}/.env
    environment:
      PORT: "5000"
      NODE_ENV: production
      RAG_PROVIDER_MODE: http
      FASTAPI_BASE_URL: http://python-rag:8000
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      - python-rag
    networks:
      - finace

networks:
  finace:
    driver: bridge
