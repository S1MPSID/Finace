# Pull pre-built image from Docker Hub (no build on EC2).
#
# On your PC:
#   docker build -t YOUR_USER/finace-rag:latest ./python-rag
#   docker push YOUR_USER/finace-rag:latest
#
# On EC2:
#   export DOCKER_IMAGE=YOUR_USER/finace-rag:latest
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d

services:
  python-rag:
    image: ${DOCKER_IMAGE:-sambhav30/finace-rag:latest}
    container_name: finace-python-rag
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      PORT: "8000"
      DATA_DIR: /app/data
      EMBEDDING_BACKEND: fastembed
      RAG_LIGHT_XAI: "1"
      RETRIEVAL_MAX_CANDIDATES: "300"
      WARM_EMBEDDER: "1"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=10)"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 180s
