services:
  - type: web
    name: finace-python-rag
    runtime: python
    rootDir: python-rag
    plan: free
    buildCommand: bash build.sh
    startCommand: uvicorn api.app:app --host 0.0.0.0 --port $PORT --workers 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: EMBEDDING_BACKEND
        value: fastembed
      - key: EMBEDDING_MODEL
        value: BAAI/bge-large-en-v1.5
      - key: RAG_LIGHT_XAI
        value: "1"
      - key: RETRIEVAL_MAX_CANDIDATES
        value: "500"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
